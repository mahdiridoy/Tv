name: Telegram Notify on Push

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'mahdi_iptv.m3u8'
      - 'ridoyiptv.m3u'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Telegram secrets
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "ERROR: Telegram secrets not configured!"
            echo "Please add these secrets in your repository settings:"
            echo "  - TELEGRAM_BOT_TOKEN: Your Telegram bot token"
            echo "  - TELEGRAM_CHAT_ID: Your Telegram chat ID"
            echo "  - TELEGRAM_CHANNEL (optional): Your Telegram channel username"
            exit 1
          fi
          echo "Telegram secrets verified"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate mahdi_scan_stats.json (for manual mahdi upload)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "mahdi_iptv.m3u8" || git show --name-only --pretty=format: HEAD | grep -q "mahdi_iptv.m3u8"; then
            echo "mahdi_iptv.m3u8 changed - counting channels..."
            COUNT=$(grep -c "^#EXTINF" mahdi_iptv.m3u8 || echo 0)
            echo "Total channels: $COUNT"
            python -c "
          import json
          c=int(open('mahdi_iptv.m3u8',encoding='utf-8',errors='ignore').read().count('#EXTINF'))
          open('mahdi_scan_stats.json','w').write(json.dumps({'total':c}, indent=2))
          print(f'Generated mahdi_scan_stats.json with {c} total channels')
          "
            git config user.email "bot@iptv.local"
            git config user.name "IPTV Bot"
            git add mahdi_scan_stats.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto count: mahdi_scan_stats.json ($COUNT channels)"
              git push origin main || echo "Push failed, will still notify with local count"
            else
              echo "No stats change"
            fi
          else
            echo "Not a mahdi upload, skip"
          fi

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python -c "
          import os, json, urllib.parse, urllib.request, subprocess, sys

          token = os.environ.get('TG_TOKEN', '')
          chat_id = os.environ.get('TG_CHAT', '')
          trigger_sha = os.environ.get('TRIGGER_SHA', '')

          if not token or not chat_id:
              print('ERROR: Telegram secrets not set!')
              print('Please add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to repository secrets.')
              sys.exit(1)

          # Use the original triggering commit SHA, not HEAD
          # HEAD may have changed due to stats commit
          sha_to_check = trigger_sha if trigger_sha else 'HEAD'
          print(f'Checking triggering commit: {sha_to_check}')

          commit_files = subprocess.run(['git', 'show', '--name-only', '--pretty=format:', sha_to_check], capture_output=True, text=True).stdout.strip()
          all_files = set(commit_files.split('\n') if commit_files else [])
          print(f'Files in triggering commit: {all_files}')

          # Fallback: if no files detected, check if mahdi_iptv.m3u8 exists
          if not all_files or all_files == {''}:
              if os.path.exists('mahdi_iptv.m3u8'):
                  all_files.add('mahdi_iptv.m3u8')
                  print('Fallback: mahdi_iptv.m3u8 exists, assuming it was updated')

          filename = None
          url = None
          source = None
          stats_file = None

          if 'mahdi_iptv.m3u8' in all_files:
              filename = 'Pulse Stream Server 1'
              url = 'https://mahdiridoy.github.io/Tv/mahdi_iptv.m3u8'
              source = 'LOCAL CHECK'
              stats_file = 'mahdi_scan_stats.json'
          elif 'ridoyiptv.m3u' in all_files:
              filename = 'Pulse Stream Server 2'
              url = 'https://mahdiridoy.github.io/Tv/ridoyiptv.m3u'
              source = 'ONLINE CHECK'
              stats_file = 'ridoy_scan_stats.json'
          else:
              print('No playlist file changed, skipping')
              print(f'Files in triggering commit: {commit_files}')
              sys.exit(0)

          # Read scan stats
          valid = '?'
          if stats_file and os.path.exists(stats_file):
              try:
                  with open(stats_file) as f:
                      stats = json.load(f)
                  valid = stats.get('total', stats.get('alive', '?'))
              except Exception as e:
                  print(f'Error reading stats: {e}')

          # Get scan time and convert to Bangladesh time Asia/Dhaka 12-hour with +06:00
          raw_ts = subprocess.run(['git', 'log', '-1', '--pretty=format:%ci'], capture_output=True, text=True).stdout.strip()
          try:
              from datetime import datetime
              from zoneinfo import ZoneInfo
              dt = datetime.strptime(raw_ts, '%Y-%m-%d %H:%M:%S %z')
              dt_bd = dt.astimezone(ZoneInfo('Asia/Dhaka'))
              ts_tmp = dt_bd.strftime('%Y-%m-%d %I:%M:%S %p %z')
              timestamp = ts_tmp[:-2] + ':' + ts_tmp[-2:]
          except Exception as e:
              print(f'Time convert error: {e}')
              timestamp = raw_ts

          msg = (
              f'\u2705 {filename}\n'
              f'\U0001f4fa Live Channel: {valid}\n'
              f'\U0001f552 {timestamp}'
          )

          tg_url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg}).encode()
          try:
              resp = urllib.request.urlopen(urllib.request.Request(tg_url, data=data, method='POST'), timeout=10)
              print('Telegram notification sent to chat! Response:', resp.read().decode()[:200])
          except Exception as e:
              print(f'Telegram error (chat): {e}')
              try:
                  import urllib.error
                  print(e.read().decode() if hasattr(e, 'read') else '')
              except: pass
          # Also forward to channel @liveapkpulse
          channel_id = os.environ.get('TG_CHANNEL', '@liveapkpulse')
          print(f'Forwarding to channel: {channel_id}')
          try:
              ch_data = urllib.parse.urlencode({'chat_id': channel_id, 'text': msg}).encode()
              resp = urllib.request.urlopen(urllib.request.Request(tg_url, data=ch_data, method='POST'), timeout=10)
              print('Telegram forwarded to channel! Response:', resp.read().decode()[:300])
          except Exception as e:
              print(f'Telegram error (channel {channel_id}): {e}')
              try:
                  body = e.read().decode() if hasattr(e, 'read') else ''
                  print('Channel error body:', body)
                  # Common errors:
                  if 'chat not found' in body.lower():
                      print('HINT: Channel @liveapkpulse not found or bot not admin. Make bot ADMIN with Post permission.')
                  if 'not enough rights' in body.lower() or 'admin' in body.lower():
                      print('HINT: Bot needs to be ADMIN in channel with Post messages permission.')
              except: pass
              # Fallback try without @
              try:
                  ch_data2 = urllib.parse.urlencode({'chat_id': 'liveapkpulse', 'text': msg}).encode()
                  resp2 = urllib.request.urlopen(urllib.request.Request(tg_url, data=ch_data2, method='POST'), timeout=10)
                  print('Fallback without @ succeeded:', resp2.read().decode()[:200])
              except Exception as e2:
                  print(f'Fallback also failed: {e2}')
          "

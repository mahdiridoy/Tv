name: Telegram Notify on Push

on:
  push:
    branches: [main]
    paths:
      - 'mahdi_iptv.m3u8'
      - 'ridoyiptv.m3u'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, json, urllib.parse, urllib.request, subprocess, sys

          token = os.environ.get('TG_TOKEN', '')
          chat_id = os.environ.get('TG_CHAT', '')

          if not token or not chat_id:
              print('ERROR: Telegram secrets not set')
              sys.exit(0)

          # Detect which file was updated - check last 5 commits for safety
          diff = subprocess.run(['git', 'diff', '--name-only', 'HEAD~5', 'HEAD'], capture_output=True, text=True).stdout.strip()
          files = diff.split('\n') if diff else []
          
          # Also check what files exist in the commit
          commit_files = subprocess.run(['git', 'show', '--name-only', '--pretty=format:', 'HEAD'], capture_output=True, text=True).stdout.strip()
          all_files = set(files + commit_files.split('\n') if commit_files else files)

          filename = None
          url = None
          source = None
          stats_file = None

          if 'mahdi_iptv.m3u8' in all_files:
              filename = 'MAHDI IPTV'
              url = 'https://mahdiridoy.github.io/Tv/mahdi_iptv.m3u8'
              source = 'LOCAL CHECK'
              stats_file = 'mahdi_scan_stats.json'
          elif 'ridoyiptv.m3u' in all_files:
              filename = 'RIDOY IPTV'
              url = 'https://mahdiridoy.github.io/Tv/ridoyiptv.m3u'
              source = 'ONLINE CHECK'
              stats_file = 'ridoy_scan_stats.json'
          else:
              print('No playlist file changed, skipping')
              print(f'Files in diff: {files}')
              print(f'Files in commit: {commit_files}')
              sys.exit(0)

          # Read scan stats
          total = valid = dead = latency = '?'
          if os.path.exists(stats_file):
              try:
                  with open(stats_file) as f:
                      stats = json.load(f)
                  total = stats.get('total', '?')
                  valid = stats.get('alive', '?')
                  dead = stats.get('dead', '?')
                  latency = stats.get('avg_latency_ms', '?')
              except Exception as e:
                  print(f'Error reading stats: {e}')

          # Get commit hash and timestamp
          commit = subprocess.run(['git', 'log', '-1', '--pretty=format:%h'], capture_output=True, text=True).stdout.strip()
          timestamp = subprocess.run(['git', 'log', '-1', '--pretty=format:%ci'], capture_output=True, text=True).stdout.strip()

          msg = (
              f'\u2705 IPTV playlist updated - {filename}\n'
              f'\U0001f552 {timestamp}   ({commit})\n\n'
              f'\U0001f4fa Final channels: {valid}\n'
              f'\U0001f5d1\ufe0f Removed (dead/buffering): {dead}\n'
              f'\u26a1 Avg latency: {latency} ms\n\n'
              f'\U0001f517 {url}\n'
              f'\U0001f4e6 Source: {source}'
          )

          tg_url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg}).encode()
          try:
              urllib.request.urlopen(urllib.request.Request(tg_url, data=data, method='POST'), timeout=10)
              print('Telegram notification sent!')
          except Exception as e:
              print(f'Telegram error: {e}')
              sys.exit(1)
          "

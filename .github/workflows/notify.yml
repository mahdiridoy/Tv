name: Telegram Notify mahdi_iptv.m3u8

on:
  push:
    branches: [main]
    paths:
      - 'mahdi_iptv.m3u8'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python -c "
          import os, urllib.parse, urllib.request

          token = os.environ.get('TG_TOKEN', '')
          chat_id = os.environ.get('TG_CHAT', '')
          channel_id = os.environ.get('TG_CHANNEL', '@liveapkpulse')

          if not token or not chat_id:
              print('ERROR: Telegram secrets not set!')
              exit(1)

          def count_channels(filepath):
              if not os.path.exists(filepath):
                  return '?'
              with open(filepath, encoding='utf-8', errors='ignore') as f:
                  return sum(1 for line in f if line.strip().startswith('#EXTINF'))

          count = count_channels('mahdi_iptv.m3u8')

          from datetime import datetime
          from zoneinfo import ZoneInfo
          ts = datetime.now(ZoneInfo('Asia/Dhaka')).strftime('%Y-%m-%d %I:%M:%S %p +06:00')

          msg = f'\u2705 Pulse Stream Server 1\n\U0001f4fa Live Channel: {count}\n\U0001f552 {ts}'
          print(f'Message: {msg}')

          tg_url = f'https://api.telegram.org/bot{token}/sendMessage'

          try:
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg}).encode()
              urllib.request.urlopen(urllib.request.Request(tg_url, data=data, method='POST'), timeout=10)
              print('Sent to chat OK')
          except Exception as e:
              print(f'Chat error: {e}')

          try:
              data = urllib.parse.urlencode({'chat_id': channel_id, 'text': msg}).encode()
              urllib.request.urlopen(urllib.request.Request(tg_url, data=data, method='POST'), timeout=10)
              print('Sent to channel OK')
          except Exception as e:
              print(f'Channel error: {e}')
          "

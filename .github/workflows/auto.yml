name: IPTV PRO Auto Engine

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run M3U Merger
        run: python merge_m3u.py

      - name: Run Adult Filter
        run: python adult_filter.py

      - name: Run Logo Attacher
        run: python attach_logos.py

      - name: Order by CHANNEL_ORDER
        run: python order_m3u.py

      - name: Run Link Validation
        run: python scan_valid.py merged.m3u merged.m3u --stats-file ridoy_scan_stats.json

      - name: Prepare output file
        run: cp merged.m3u ridoyiptv.m3u

      - name: Push to main branch
        run: |
          git config user.email "bot@iptv.local"
          git config user.name "IPTV Bot"
          git add ridoyiptv.m3u ridoy_scan_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto update: ridoyiptv.m3u"
            git push origin main
          else
            echo "No changes to push."
          fi

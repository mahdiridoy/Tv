name: IPTV PRO Auto Engine

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run regression tests
        run: pytest tests/ -v

      # ───────── NO-SCAN PIPELINE (final) ─────────

      - name: "[No-scan] Run M3U Merger"
        run: python merge_m3u.py

      - name: "[No-scan] Run Adult Filter"
        run: python adult_filter.py

      - name: "[No-scan] Run Logo Attacher"
        run: python attach_logos.py

      - name: "[No-scan] Order by CHANNEL_ORDER"
        run: python order_m3u.py

      - name: Prepare output file
        run: cp merged.m3u mahdi_iptv.m3u8

      - name: Commit to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mahdi_iptv.m3u8 merged.m3u sources2.txt

          if ! git diff --cached --quiet; then
            git commit -m "Auto update: playlist"
            git push
          else
            echo "No changes to commit."
          fi

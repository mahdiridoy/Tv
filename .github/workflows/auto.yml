name: IPTV PRO Auto Engine

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: iptv-pro-auto-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run IPTV Processor
        run: python processor.py

      - name: Run Adult Filter
        run: python filter_adult.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.m3u stats.txt ridoyiptv.m3u

          git diff --cached --quiet || (
            git commit -m "Auto update: processed + filtered playlist"
            git push
          )

      - name: Wait before next run
        run: sleep 1800   # 30 min gap after finish — adjust as needed

      - name: Trigger next run
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto.yml/dispatches \
            -d '{"ref":"main"}'

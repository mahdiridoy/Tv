name: IPTV PRO Auto Engine

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run M3U Merger
        run: python merge_m3u.py

      - name: Run Adult Filter
        run: python adult_filter.py

      - name: Run Logo Attacher
        run: python attach_logos.py

      - name: Order by CHANNEL_ORDER
        run: python order_m3u.py

      - name: Run Link Validation
        run: python scan_valid.py merged.m3u merged.m3u

      - name: Prepare output file
        run: cp merged.m3u ridoyiptv.m3u

      # Push ONLY ridoyiptv.m3u to gh-pages branch
      - name: Push to gh-pages branch
        run: |
          TEMP_DIR=$(mktemp -d)
          cp ridoyiptv.m3u "$TEMP_DIR/ridoyiptv.m3u"
          cd "$TEMP_DIR"
          git init
          git config user.email "bot@iptv.local"
          git config user.name "IPTV Bot"
          git branch -M gh-pages
          git remote add origin https://github.com/${{ github.repository }}.git
          git add ridoyiptv.m3u
          git commit -m "Auto update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -u origin gh-pages --force

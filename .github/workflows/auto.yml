name: IPTV PRO Auto Engine

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run M3U Merger
        run: python merge_m3u.py

      - name: Run Adult Filter
        run: python adult_filter.py

      - name: Run Logo Attacher
        run: python attach_logos.py

      - name: Order by CHANNEL_ORDER
        run: python order_m3u.py

      - name: Run Link Validation
        run: python scan_valid.py merged.m3u merged.m3u

      - name: Prepare output file
        run: cp merged.m3u ridoyiptv.m3u

      # Push ONLY ridoyiptv.m3u to gh-pages branch
      - name: Push to gh-pages branch
        run: |
          TEMP_DIR=$(mktemp -d)
          cp ridoyiptv.m3u "$TEMP_DIR/ridoyiptv.m3u"
          cd "$TEMP_DIR"
          git init
          git config user.email "bot@iptv.local"
          git config user.name "IPTV Bot"
          git branch -M gh-pages
          git remote add origin https://github.com/${{ github.repository }}.git
          git add ridoyiptv.m3u
          git commit -m "Auto update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -u origin gh-pages --force

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, urllib.parse, urllib.request
          token = os.environ.get('TG_TOKEN', '')
          chat_id = os.environ.get('TG_CHAT', '')
          if token and chat_id:
              msg = '📺 IPTV Playlist Updated!\n\nFile: ridoyiptv.m3u\nURL: https://mahdiridoy.github.io/Tv/ridoyiptv.m3u\n\nTime: $(date -u +%Y-%m-%d %H:%M UTC)'
              url = f'https://api.telegram.org/bot{token}/sendMessage'
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg}).encode()
              urllib.request.urlopen(urllib.request.Request(url, data=data, method='POST'), timeout=10)
              print('Telegram notification sent!')
          else:
              print('Telegram secrets not set, skipping notification')
          "

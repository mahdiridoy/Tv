name: IPTV PRO Auto Engine

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: iptv-pro-auto-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run IPTV Processor
        run: python processor.py

      - name: Run Adult Filter
        run: python filter_adult.py

      - name: Upload playlist as Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-playlist"
          git tag -f "$TAG"
          git push origin "$TAG" --force

          gh release delete "$TAG" --yes --repo ${{ github.repository }} || true
          gh release create "$TAG" output.m3u ridoyiptv.m3u stats.txt \
            --repo ${{ github.repository }} \
            --title "Latest IPTV Playlist" \
            --notes "Auto-updated $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: Wait before next run
        run: sleep 1800

      - name: Trigger next run
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto.yml/dispatches \
            -d '{"ref":"main"}'

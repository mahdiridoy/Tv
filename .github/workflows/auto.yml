name: IPTV PRO Auto Engine

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run M3U Merger
        run: python merge_m3u.py

      - name: Run Adult Filter
        run: python adult_filter.py

      - name: Run Logo Attacher
        run: python attach_logos.py

      - name: Order by CHANNEL_ORDER
        run: python order_m3u.py

      - name: Run Link Validation
        run: python scan_valid.py merged.m3u merged.m3u --stats-file ridoy_scan_stats.json

      - name: Prepare output file
        run: |
          cp merged.m3u ridoyiptv.m3u
          # Add timestamp to force change every run
          sed -i "1i# Generated: $(date -u)" ridoyiptv.m3u

      - name: Push to main branch
        run: |
          git config user.email "bot@iptv.local"
          git config user.name "IPTV Bot"
          # If GH_PAT exists, use it so push triggers notify.yml
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
            echo "Using GH_PAT for push (will trigger notify.yml)"
          fi
          git add ridoyiptv.m3u ridoy_scan_stats.json
          git commit -m "Auto update: ridoyiptv.m3u [$(date -u)]"
          git push origin main

      - name: Send Telegram notification (direct - works even without GH_PAT)
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, json, urllib.parse, urllib.request, subprocess
          token = os.environ.get('TG_TOKEN','')
          chat_id = os.environ.get('TG_CHAT','')
          if not token or not chat_id:
              print('Telegram secrets missing, skip')
              exit(0)
          stats_file='ridoy_scan_stats.json'
          if os.path.exists(stats_file):
              with open(stats_file) as f: s=json.load(f)
              valid=s.get('alive','?'); dead=s.get('dead','?'); latency=s.get('avg_latency_ms','?'); median=s.get('median_latency_ms','?')
          else: valid=dead=latency=median='?'
          commit=subprocess.run(['git','log','-1','--pretty=format:%h'],capture_output=True,text=True).stdout.strip()
          ts=subprocess.run(['git','log','-1','--pretty=format:%ci'],capture_output=True,text=True).stdout.strip()
          msg=(f'\u2705 IPTV playlist updated - RIDOY IPTV\n\U0001f552 {ts}   ({commit})\n\n\U0001f4fa Final channels: {valid}\n\U0001f5d1\ufe0f Removed (dead/buffering): {dead}\n\u26a1 Avg latency: {latency} ms (median {median} ms)\n\n\U0001f517 https://mahdiridoy.github.io/Tv/ridoyiptv.m3u\n\U0001f4e6 Source: ONLINE CHECK')
          tg_url=f'https://api.telegram.org/bot{token}/sendMessage'
          data=urllib.parse.urlencode({'chat_id':chat_id,'text':msg}).encode()
          urllib.request.urlopen(urllib.request.Request(tg_url,data=data,method='POST'),timeout=10)
          print('Telegram sent for RIDOY IPTV')
          "

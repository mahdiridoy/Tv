<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }

  /* ---------- Ad slots: normal page flow, always visible, no scroll boxes ---------- */
  .ad-slot {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  .ad-label {
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,.45);
    margin-bottom: 4px;
  }
  .native-slot { max-width: 728px; min-height: 90px; }
  .banner-slot { min-height: 60px; }

  /* ---------- Splash ---------- */
  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1rem;
  }
  .brand {
    font-size: clamp(1.4rem, 5vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 20px rgba(100,149,237,.6);
  }
  .brand span { color: #6495ed; }
  .updating {
    font-size: clamp(1rem, 3vw, 1.6rem);
    color: #ccc;
    margin-bottom: 2rem;
  }
  .timer {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 900;
    line-height: 1;
    color: #6495ed;
    text-shadow: 0 0 30px rgba(100,149,237,.8);
  }
  .progress-bar {
    width: min(80vw, 400px);
    height: 6px;
    margin: 2rem auto 0;
    background: rgba(255,255,255,.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #6495ed, #00bfff);
    transform-origin: left;
    animation: countdown 15s linear forwards;
  }
  @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .go-btn {
    display: none;
    margin: 1.5rem auto 0;
    padding: 12px 28px;
    border-radius: 8px;
    background: #6495ed;
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
  }
  .go-btn:focus-visible, .sponsored-link:focus-visible { outline: 3px solid #00bfff; outline-offset: 3px; }
  .sponsored-link {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    background: rgba(255,255,255,.08);
  }

  @media (prefers-reduced-motion: reduce) { .progress-fill { animation: none; } }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Stream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .container {
    text-align: center;
    padding: 2rem;
    max-width: 90vw;
  }
  .brand {
    font-size: clamp(1.4rem, 5vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 20px rgba(100, 149, 237, 0.6);
  }
  .brand span {
    color: #6495ed;
  }
  .updating {
    font-size: clamp(1rem, 3vw, 1.6rem);
    color: #ccc;
    margin-bottom: 2rem;
  }
  .timer {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 900;
    color: #6495ed;
    text-shadow: 0 0 30px rgba(100, 149, 237, 0.8);
    line-height: 1;
  }
  .progress-bar {
    margin: 2rem auto 0;
    width: min(80vw, 400px);
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #6495ed, #00bfff);
    border-radius: 3px;
    transform-origin: left;
    animation: countdown 5s linear forwards;
  }
  @keyframes countdown {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }
  @media (max-width: 480px) {
    .container { padding: 1rem; }
  }
</style>

<body>
  <div class="container">
    <div class="brand">Presented By <span>Pulse Stream</span></div>
    <div class="updating">Updating Please Wait..</div>
    <div class="timer" id="timer">5</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
  <script>
    let count = 5;
    const el = document.getElementById('timer');
    const iv = setInterval(() => {
      count--;
      if (count <= 0) {
        clearInterval(iv);
        el.textContent = "✓";
      } else {
        el.textContent = count;
      }
    }, 1000);
  </script>

<title>Pulse Stream</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;               /* no page scroll on any screen size */
  }

  body {
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }

  /* ---------- Visible ad slots: fixed row, sized to the creative, own row so nothing overlaps ---------- */
  .ad-slot {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: visible;               /* never clip the creative — a clipped ad won't count as a valid view */
    padding: 6px 8px;
  }
  .ad-label {
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,.45);
    margin-bottom: 4px;
  }
  .native-slot { max-width: 728px; min-height: 100px; margin: 0 auto; }
  .banner-slot { min-height: 60px; }

  /* ---------- Splash: takes all remaining space, never pushes ad slot off screen ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;                  /* lets flex child shrink instead of overflowing */
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
  }
  .brand {
    font-size: clamp(1.2rem, 5vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 1.2rem;
    text-shadow: 0 0 20px rgba(100,149,237,.6);
  }
  .brand span { color: #6495ed; }
  .updating {
    font-size: clamp(.9rem, 3vw, 1.6rem);
    color: #ccc;
    margin-bottom: 1.5rem;
  }
  .progress-bar {
    width: min(80vw, 400px);
    height: 6px;
    margin: 1.5rem auto 0;
    background: rgba(255,255,255,.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #6495ed, #00bfff);
    transform-origin: left;
    animation: countdown 15s linear forwards;
  }
  @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  @media (prefers-reduced-motion: reduce) { .progress-fill { animation: none; } }
</style>
</head>

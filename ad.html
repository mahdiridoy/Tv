    <!-- =========================================================
         5 SECOND COUNTDOWN
         ORIGINAL LOGIC PRESERVED
         ========================================================= -->

    <script>

        (() => {

            const duration = 5;

            let remaining = duration;

            const timer =
                document.getElementById("timer");

            const progress =
                document.querySelector(".progress-bar");


            const interval =
                setInterval(() => {

                    remaining--;


                    if (remaining <= 0) {

                        clearInterval(interval);

                        timer.textContent = "✓";

                        progress.setAttribute(
                            "aria-valuenow",
                            "0"
                        );

                        return;
                    }


                    timer.textContent =
                        remaining;


                    progress.setAttribute(
                        "aria-valuenow",
                        remaining
                    );


                }, 1000);

        })();

    </script>

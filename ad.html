<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Pulse Stream</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;               /* no page scroll on any screen size */
  }

  body {
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }

  /* ---------- Splash: takes all remaining space ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
  }
  .splash { width: 100%; }

  .brand {
    font-size: clamp(1.2rem, 5vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: .9rem;
    text-shadow: 0 0 20px rgba(100,149,237,.6);
  }
  .brand span { color: #6495ed; }
  .updating {
    font-size: clamp(.9rem, 3vw, 1.6rem);
    color: #ccc;
    margin-bottom: 1rem;
  }

  /* ---------- Responsive autoplay video (16:9, fits any screen) ---------- */
  .video-wrap {
    /* width respects all three limits: viewport width, layout cap, and the
       viewport-height cap converted to a width (keeps 16:9 on short screens) */
    width: min(92vw, 900px, calc(56vh * 16 / 9));
    max-width: 100%;
    max-height: min(56vh, calc(92vw * 9 / 16));
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    position: relative;
  }
  .video-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .sound-hint { position:absolute; inset:auto 0 10px 0; margin:auto; width:max-content; padding:8px 16px; background:rgba(0,0,0,.75); color:#fff; font-size:14px; border-radius:999px; z-index:5; cursor:pointer; }

  .progress-bar {
    width: min(80vw, 400px);
    height: 6px;
    margin: 1rem auto 0;
    background: rgba(255,255,255,.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #6495ed, #00bfff);
    transform-origin: left;
    animation: countdown 15s linear forwards;
  }
  @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* compact stack on short screens (e.g. landscape phones) — nothing clips */
  @media (max-height: 620px) {
    main { padding: .6rem; }
    .brand { font-size: clamp(1.1rem, 4vw, 1.8rem); margin-bottom: .6rem; }
    .updating { font-size: clamp(.8rem, 2.5vw, 1.1rem); margin-bottom: .7rem; }
    .progress-bar { margin-top: .7rem; }
    .video-wrap { width: min(92vw, 900px, calc(52vh * 16 / 9)); max-height: min(52vh, calc(92vw * 9 / 16)); }
  }

  @media (prefers-reduced-motion: reduce) { .progress-fill { animation: none; } }
</style>
</head>

<body>

<!-- CENTER: splash, fills all remaining height on any screen size -->
<main>
  <div class="splash">
    <div class="brand">Presented By <span>Pulse Stream</span></div>
    <div class="updating">Preparing your stream, please wait...</div>

    <!-- Responsive YouTube embed: attempts unmuted autoplay, sound guaranteed on first interaction -->
    <div class="video-wrap">
      <div id="ytplayer"></div>
      <div class="sound-hint" id="soundHint">&#128266; Tap for sound</div>
    </div>

    <div class="progress-bar" role="progressbar" aria-label="Loading"
         aria-valuemin="0" aria-valuemax="15" aria-valuenow="15">
      <div class="progress-fill"></div>
    </div>
  </div>
</main>

<!-- YouTube IFrame Player API: unmuted autoplay attempt + guaranteed audio on first interaction -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function () {
  function hideHint() {
    var h = document.getElementById('soundHint');
    if (h) { h.style.display = 'none'; }
  }

  function installUnmuteOnInteraction(player) {
    function handler() {
      document.removeEventListener('pointerdown', handler);
      document.removeEventListener('keydown', handler);
      document.removeEventListener('touchend', handler);
      try {
        if (player.isMuted && player.isMuted()) player.unMute();
        if (player.playVideo) player.playVideo();
      } catch (e) {}
      hideHint();
    }
    document.addEventListener('pointerdown', handler);
    document.addEventListener('keydown', handler);
    document.addEventListener('touchend', handler);
  }

  window.onYouTubeIframeAPIReady = function () {
    new YT.Player('ytplayer', {
      videoId: 'UIG1vCboNyI',
      playerVars: { autoplay: 1, mute: 0, playsinline: 1, rel: 0 },
      events: {
        onReady: function (e) {
          try { e.target.playVideo(); } catch (err) {}
          if (!(e.target.isMuted && e.target.isMuted())) { hideHint(); }
          installUnmuteOnInteraction(e.target);
        }
      }
    });
  };

  // Fallback: if the API never becomes available, inject a static embed.
  setTimeout(function () {
    if (window.YT && YT.Player) return;
    var wrap = document.querySelector('.video-wrap');
    if (!wrap || document.getElementById('ytplayer').tagName === 'IFRAME') return;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/UIG1vCboNyI?autoplay=1&playsinline=1';
    f.title = 'YouTube video player';
    f.frameborder = '0';
    f.setAttribute('frameborder', '0');
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.referrerpolicy = 'strict-origin-when-cross-origin';
    f.allowFullscreen = true;
    var holder = document.getElementById('ytplayer');
    holder.parentNode.replaceChild(f, holder);
  }, 4000);
})();
</script>

</body>
</html>

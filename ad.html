    <!-- =====================================================
         PULSE STREAM DESIGN
         ===================================================== -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background:
                linear-gradient(
                    135deg,
                    #0f0c29,
                    #302b63,
                    #24243e
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 90vw;
            padding: 2rem;
            text-align: center;
        }

        .brand {
            font-size:
                clamp(1.4rem, 5vw, 2.8rem);

            font-weight: 700;
            letter-spacing: 2px;

            margin-bottom: 1.5rem;

            text-shadow:
                0 0 20px
                rgba(100, 149, 237, 0.6);
        }

        .brand span {
            color: #6495ed;
        }

        .updating {
            font-size:
                clamp(1rem, 3vw, 1.6rem);

            color: #ccc;

            margin-bottom: 2rem;
        }

        .timer {
            font-size:
                clamp(3rem, 10vw, 6rem);

            font-weight: 900;
            line-height: 1;

            color: #6495ed;

            text-shadow:
                0 0 30px
                rgba(100, 149, 237, 0.8);
        }

        .progress-bar {
            width:
                min(80vw, 400px);

            height: 6px;

            margin: 2rem auto 0;

            background:
                rgba(255, 255, 255, 0.15);

            border-radius: 3px;

            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #6495ed,
                    #00bfff
                );

            border-radius: 3px;

            transform-origin: left;

            animation:
                countdown 5s linear forwards;
        }

        @keyframes countdown {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress-fill {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         PULSE STREAM SPLASH
         ===================================================== -->

    <main class="container">

        <div class="brand">
            Presented By
            <span>Pulse Stream</span>
        </div>

        <div class="updating">
            Updating Please Wait..
        </div>

        <div
            class="timer"
            id="timer"
            aria-live="polite"
        >
            5
        </div>

        <div
            class="progress-bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="5"
            aria-valuenow="5"
            aria-label="Loading"
        >
            <div class="progress-fill"></div>
        </div>

    </main>


    <!-- =====================================================
         5 SECOND COUNTDOWN
         ===================================================== -->

    <script>
        (() => {
            const duration = 5;
            let remaining = duration;

            const timer =
                document.getElementById("timer");

            const progress =
                document.querySelector(".progress-bar");

            const interval =
                setInterval(() => {

                    remaining--;

                    if (remaining <= 0) {

                        clearInterval(interval);

                        timer.textContent = "✓";

                        progress.setAttribute(
                            "aria-valuenow",
                            "0"
                        );

                        return;
                    }

                    timer.textContent =
                        remaining;

                    progress.setAttribute(
                        "aria-valuenow",
                        remaining
                    );

                }, 1000);

        })();
    </script>

</body>
